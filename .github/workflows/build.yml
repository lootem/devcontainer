name: Docker Build

# Runs on every PR so it can be a required status check without wedging PRs
# that don't touch the Dockerfile: the job always reports a result, but only
# rebuilds the image when the Dockerfile actually changed. (A path filter here
# would leave the required check permanently pending on unrelated PRs.)
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly multi-architecture validation catches withdrawn Kiro artifacts.
    - cron: '0 13 * * 3'
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      dockerfile: ${{ steps.changed.outputs.dockerfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Did the Dockerfile change?
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # Build when we can't compute a diff (first push / missing base) to stay safe.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            changed=true
          # A .devcontainer/dependencies.lock.json-only Kiro update is
          # build-relevant even when the Dockerfile itself is unchanged. This
          # is the kiro-changing PR validation gate.
          elif git diff --name-only "$base" "$head" | grep -qE \
            '^(\.devcontainer/(Dockerfile|dependencies\.lock\.json)|install\.sh|renovate\.json5|\.github/(renovate-global\.json5|workflows/build\.yml)|templates/(basegitignore|docker-compose\.yml)|\.env\.example)$'; then
            changed=true
          else
            changed=false
          fi
          echo "dockerfile=$changed" >> "$GITHUB_OUTPUT"

  # Always runs (job-level, not gated) so it stays a valid required status
  # check on PRs that don't touch the Dockerfile - steps below no-op instead.
  # Native runners build each arch directly - no QEMU emulation.
  build:
    needs: detect
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: needs.detect.outputs.dockerfile == 'true'

      # Build with every feature ARG on so a bump to any feature layer
      # (azcli/pwsh/azpwsh/awscli included) actually compiles, not just the
      # default python/go/js/dotnet baseline. Never pushed. Both arches must
      # build - a missing arm64 build is a failure, never a silent skip.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: needs.detect.outputs.dockerfile == 'true'
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: false
          platforms: ${{ matrix.platform }}
          build-args: |
            CLAUDECODE=true
            CODEX=true
            OPENCODE=true
            KIRO=true
            GOLANG=true
            PYTHON=true
            NODEJS=true
            DOTNET=true
            AZCLI=true
            POWERSHELL=true
            AZPWSH=true
            AWSCLI=true
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

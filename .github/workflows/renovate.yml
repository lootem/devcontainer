name: Renovate

on:
  schedule:
    - cron: '0 5 * * *' # every day at 5:00 UTC
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          configurationFile: .github/renovate-global.json5
          token: ${{ secrets.RENOVATE_TOKEN }}

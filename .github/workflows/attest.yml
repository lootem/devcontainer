name: Attest Install Scripts

# Attests the scripts that get curl|bash'd by users (install.sh, and
# install.sh shipped into every generated repo) so `gh attestation verify` can prove
# "this file came from a workflow run in this repo at commit X". That's a
# provenance guarantee, not a content-safety one - see README "Verify before
# you run".
on:
  push:
    branches: [main]
    paths:
      - install.sh
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            install.sh
